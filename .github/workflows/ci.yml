name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # expo-env.d.ts and .expo/types/*.d.ts are gitignored and normally
      # generated by `expo start` -- this is the documented no-dev-server
      # equivalent for CI (https://docs.expo.dev, "Type generation").
      - run: npx expo customize tsconfig.json

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test -- --ci
